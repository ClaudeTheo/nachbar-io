<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Nachbar.io Systemkarte</title>
  <desc id="desc">Uebersicht der Nachbar.io QuartierApp mit Nutzerrollen, Clients, Kernmodulen, Backend, externen Integrationen, Pilot-0 Registrierung und Sicherheitsgrenzen.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2D3142" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#3D3D50"/>
    </marker>
    <style>
      .bg { fill: #fdf8f3; }
      .title { font: 800 42px Inter, Arial, sans-serif; fill: #2D3142; letter-spacing: 0; }
      .subtitle { font: 500 18px Inter, Arial, sans-serif; fill: #5f6472; letter-spacing: 0; }
      .section-title { font: 800 21px Inter, Arial, sans-serif; fill: #2D3142; letter-spacing: 0; }
      .card-title { font: 800 17px Inter, Arial, sans-serif; fill: #2D3142; letter-spacing: 0; }
      .card-text { font: 500 13px Inter, Arial, sans-serif; fill: #4b4f5d; letter-spacing: 0; }
      .small { font: 700 12px Inter, Arial, sans-serif; fill: #4b4f5d; letter-spacing: 0; }
      .tiny { font: 600 11px Inter, Arial, sans-serif; fill: #5f6472; letter-spacing: 0; }
      .badge-text { font: 800 11px Inter, Arial, sans-serif; fill: white; letter-spacing: 0; }
      .panel { fill: white; stroke: #e4ddcf; stroke-width: 1.5; rx: 22; filter: url(#shadow); }
      .card { fill: #fffaf1; stroke: #eadfca; stroke-width: 1.2; rx: 14; }
      .module { fill: #f3f8f5; stroke: #b9dccc; stroke-width: 1.2; rx: 13; }
      .backend { fill: #f3f6fb; stroke: #bfd0e5; stroke-width: 1.2; rx: 13; }
      .provider { fill: #fff6e6; stroke: #f0c987; stroke-width: 1.2; rx: 13; }
      .danger { fill: #fff0f0; stroke: #ef4444; stroke-width: 1.3; rx: 13; }
      .line { stroke: #3D3D50; stroke-width: 2.4; fill: none; marker-end: url(#arrow); opacity: 0.76; }
      .soft-line { stroke: #7f8797; stroke-width: 1.8; fill: none; marker-end: url(#arrow); opacity: 0.65; }
      .green { fill: #4CAF87; }
      .petrol { fill: #2e7d5e; }
      .anth { fill: #3D3D50; }
      .amber { fill: #F59E0B; }
      .red { fill: #EF4444; }
      .blue { fill: #3B82F6; }
      .chip { fill: #2e7d5e; rx: 999; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1120"/>

  <text class="title" x="60" y="68">Nachbar.io / QuartierApp Systemkarte</text>
  <text class="subtitle" x="62" y="102">Multi-App Quartiersplattform fuer Bad Saeckingen: Rollen, Module, Datenfluesse, Provider und Pilot-0-Zugang auf einen Blick</text>
  <rect class="petrol" x="1276" y="42" width="264" height="44" rx="22"/>
  <text class="badge-text" x="1302" y="70">Stand 2026-05-15 | Pilot 0</text>

  <!-- Column panels -->
  <rect class="panel" x="50" y="135" width="305" height="660"/>
  <text class="section-title" x="78" y="176">1. Nutzer &amp; Clients</text>

  <rect class="panel" x="395" y="135" width="520" height="660"/>
  <text class="section-title" x="423" y="176">2. App-Core in nachbar-io</text>

  <rect class="panel" x="955" y="135" width="285" height="660"/>
  <text class="section-title" x="983" y="176">3. Backend &amp; Daten</text>

  <rect class="panel" x="1280" y="135" width="270" height="660"/>
  <text class="section-title" x="1308" y="176">4. Externe Quellen</text>

  <!-- Nutzer cards -->
  <rect class="card" x="76" y="206" width="253" height="64"/>
  <text class="card-title" x="98" y="231">Bewohner</text>
  <text class="card-text" x="98" y="252">resident | Haushalt | Quartier</text>

  <rect class="card" x="76" y="284" width="253" height="64"/>
  <text class="card-title" x="98" y="309">Jugendliche 14-17</text>
  <text class="card-text" x="98" y="330">ui_mode=youth | Basiszugang</text>

  <rect class="card" x="76" y="362" width="253" height="64"/>
  <text class="card-title" x="98" y="387">Senioren</text>
  <text class="card-text" x="98" y="408">senior / comfort | einfache UI</text>

  <rect class="card" x="76" y="440" width="253" height="64"/>
  <text class="card-title" x="98" y="465">Angehoerige</text>
  <text class="card-text" x="98" y="486">caregiver | verknuepfte Senioren</text>

  <rect class="card" x="76" y="518" width="253" height="64"/>
  <text class="card-title" x="98" y="543">Kommunen / Pflege / Vereine</text>
  <text class="card-text" x="98" y="564">org_admin | org_viewer</text>

  <rect class="card" x="76" y="596" width="253" height="64"/>
  <text class="card-title" x="98" y="621">Aerzte / Praxen</text>
  <text class="card-text" x="98" y="642">doctor | doctor_admin</text>

  <rect class="card" x="76" y="674" width="253" height="74"/>
  <text class="card-title" x="98" y="699">Clients</text>
  <text class="card-text" x="98" y="720">PWA, Senior-App Wrapper,</text>
  <text class="card-text" x="98" y="738">Arzt-, Civic-, Pflege-, Admin-Portal</text>

  <!-- Core modules -->
  <rect class="module" x="425" y="206" width="220" height="70"/>
  <text class="card-title" x="447" y="232">Pilot-Onboarding</text>
  <text class="card-text" x="447" y="253">Hausnummer-Code, QR,</text>
  <text class="card-text" x="447" y="270">Family-Setup</text>

  <rect class="module" x="665" y="206" width="220" height="70"/>
  <text class="card-title" x="687" y="232">4 UI-Modi</text>
  <text class="card-text" x="687" y="253">youth, active, comfort,</text>
  <text class="card-text" x="687" y="270">senior</text>

  <rect class="module" x="425" y="294" width="220" height="70"/>
  <text class="card-title" x="447" y="320">Quartier-Karte</text>
  <text class="card-text" x="447" y="341">Leaflet, OSM,</text>
  <text class="card-text" x="447" y="358">Activity Pins</text>

  <rect class="module" x="665" y="294" width="220" height="70"/>
  <text class="card-title" x="687" y="320">Info-Hub</text>
  <text class="card-text" x="687" y="341">Warnungen, Wetter, Pollen,</text>
  <text class="card-text" x="687" y="358">Events, POI, OEPNV</text>

  <rect class="module" x="425" y="382" width="220" height="70"/>
  <text class="card-title" x="447" y="408">Hilfe-Modul</text>
  <text class="card-text" x="447" y="429">Anfragen, Anerkennung</text>
  <text class="card-text" x="447" y="446">outside-app, Guardrails</text>

  <rect class="module" x="665" y="382" width="220" height="70"/>
  <text class="card-title" x="687" y="408">Chat &amp; Gruppen</text>
  <text class="card-text" x="687" y="429">Direkt, geschuetzt,</text>
  <text class="card-text" x="687" y="446">Youth-Groups</text>

  <rect class="module" x="425" y="470" width="220" height="70"/>
  <text class="card-title" x="447" y="496">Care / Senior</text>
  <text class="card-text" x="447" y="517">Check-in, Heartbeat,</text>
  <text class="card-text" x="447" y="534">caregiver_links</text>

  <rect class="module" x="665" y="470" width="220" height="70"/>
  <text class="card-title" x="687" y="496">Jugendmodus</text>
  <text class="card-text" x="687" y="517">Tauschen, Gruppen,</text>
  <text class="card-text" x="687" y="534">sichere Drafts</text>

  <rect class="module" x="425" y="558" width="220" height="70"/>
  <text class="card-title" x="447" y="584">Doctor Discovery</text>
  <text class="card-text" x="447" y="605">Aerzte, Termine,</text>
  <text class="card-text" x="447" y="622">Portal-Bruecke</text>

  <rect class="module" x="665" y="558" width="220" height="70"/>
  <text class="card-title" x="687" y="584">Admin Ops</text>
  <text class="card-text" x="687" y="605">Feature Flags, Audit,</text>
  <text class="card-text" x="687" y="622">Health, Pilot-Reset</text>

  <rect class="danger" x="425" y="646" width="460" height="78"/>
  <text class="card-title" x="447" y="674">Gated: KI / Voice / Payment</text>
  <text class="card-text" x="447" y="697">Personenbezogene KI, Provider-Live-Schalter und Zahlungen</text>
  <text class="card-text" x="447" y="714">nur mit AVV/DPA, Founder-Go und klarer Freigabe.</text>

  <!-- Backend cards -->
  <rect class="backend" x="985" y="206" width="225" height="82"/>
  <text class="card-title" x="1007" y="233">Vercel fra1</text>
  <text class="card-text" x="1007" y="255">Next.js App Router</text>
  <text class="card-text" x="1007" y="272">API Routes, Middleware</text>

  <rect class="backend" x="985" y="312" width="225" height="96"/>
  <text class="card-title" x="1007" y="339">Supabase EU Frankfurt</text>
  <text class="card-text" x="1007" y="361">Auth, Postgres, RLS,</text>
  <text class="card-text" x="1007" y="378">Storage, Realtime</text>
  <rect class="green" x="1007" y="388" width="64" height="20" rx="10"/>
  <text class="badge-text" x="1021" y="403">RLS</text>

  <rect class="backend" x="985" y="432" width="225" height="82"/>
  <text class="card-title" x="1007" y="459">Cron / Sync</text>
  <text class="card-text" x="1007" y="481">OSM, Events, Warnungen,</text>
  <text class="card-text" x="1007" y="498">Heartbeats</text>

  <rect class="backend" x="985" y="538" width="225" height="82"/>
  <text class="card-title" x="1007" y="565">Security Layer</text>
  <text class="card-text" x="1007" y="587">Closed Pilot, Safe Links,</text>
  <text class="card-text" x="1007" y="604">Cron Secrets, Audit</text>

  <rect class="backend" x="985" y="644" width="225" height="80"/>
  <text class="card-title" x="1007" y="671">Encrypted Fields</text>
  <text class="card-text" x="1007" y="693">AES-256-GCM fuer</text>
  <text class="card-text" x="1007" y="710">sensitive Care-Daten</text>

  <!-- Provider cards -->
  <rect class="provider" x="1308" y="206" width="214" height="66"/>
  <text class="card-title" x="1330" y="232">OSM / Overpass</text>
  <text class="card-text" x="1330" y="253">Karte, POIs</text>

  <rect class="provider" x="1308" y="288" width="214" height="66"/>
  <text class="card-title" x="1330" y="314">NINA / DWD / UBA</text>
  <text class="card-text" x="1330" y="335">Warnungen, Wetter, Pollen</text>

  <rect class="provider" x="1308" y="370" width="214" height="66"/>
  <text class="card-title" x="1330" y="396">LGL-BW / DELFI</text>
  <text class="card-text" x="1330" y="417">Kartenlayer, OEPNV</text>

  <rect class="provider" x="1308" y="452" width="214" height="66"/>
  <text class="card-title" x="1330" y="478">Resend / Web Push</text>
  <text class="card-text" x="1330" y="499">Auth-Mail, Push</text>

  <rect class="danger" x="1308" y="534" width="214" height="82"/>
  <text class="card-title" x="1330" y="561">AI Provider</text>
  <text class="card-text" x="1330" y="583">Anthropic / Mistral /</text>
  <text class="card-text" x="1330" y="600">OpenAI: AVV-gated</text>

  <rect class="danger" x="1308" y="632" width="214" height="82"/>
  <text class="card-title" x="1330" y="659">Stripe / Payment</text>
  <text class="card-text" x="1330" y="681">Nicht Pilot 0,</text>
  <text class="card-text" x="1330" y="698">keine Wallet/Coins</text>

  <!-- Main arrows -->
  <path class="line" d="M 355 465 C 378 465, 378 465, 402 465"/>
  <path class="line" d="M 915 465 C 938 465, 938 465, 962 465"/>
  <path class="soft-line" d="M 1240 465 C 1260 465, 1260 465, 1282 465"/>

  <rect class="anth" x="363" y="443" width="34" height="44" rx="17"/>
  <text class="badge-text" x="374" y="470">1</text>
  <rect class="anth" x="923" y="443" width="34" height="44" rx="17"/>
  <text class="badge-text" x="934" y="470">2</text>
  <rect class="anth" x="1248" y="443" width="34" height="44" rx="17"/>
  <text class="badge-text" x="1259" y="470">3</text>

  <!-- Pilot flow -->
  <rect class="panel" x="50" y="830" width="1500" height="166"/>
  <text class="section-title" x="78" y="872">Pilot-0 Zugang: bewusst einfach</text>
  <text class="subtitle" x="78" y="898">Ein bestehender Hausnummer-Code pro Haushalt. Keine 3 Codes, kein Aushang, keine Ersatzcode-Verwaltung.</text>

  <rect class="card" x="82" y="922" width="190" height="48"/>
  <text class="small" x="105" y="943">Brief + QR</text>
  <text class="tiny" x="105" y="960">Hausnummer-Code</text>

  <rect class="card" x="312" y="922" width="190" height="48"/>
  <text class="small" x="335" y="943">/register</text>
  <text class="tiny" x="335" y="960">Code pruefen</text>

  <rect class="card" x="542" y="922" width="190" height="48"/>
  <text class="small" x="565" y="943">Supabase</text>
  <text class="tiny" x="565" y="960">household + quarter</text>

  <rect class="module" x="772" y="904" width="210" height="82"/>
  <text class="small" x="795" y="928">Ab 18</text>
  <text class="tiny" x="795" y="947">Bewohnerzugang</text>
  <text class="tiny" x="795" y="964">household_member</text>

  <rect class="module" x="1012" y="904" width="210" height="82"/>
  <text class="small" x="1035" y="928">14-17</text>
  <text class="tiny" x="1035" y="947">Jugendmodus</text>
  <text class="tiny" x="1035" y="964">Basis, keine Zahlungen</text>

  <rect class="danger" x="1252" y="904" width="210" height="82"/>
  <text class="small" x="1275" y="928">Unter 14</text>
  <text class="tiny" x="1275" y="947">Self-Service blockiert</text>
  <text class="tiny" x="1275" y="964">Eltern/Betreuer</text>

  <path class="soft-line" d="M 272 946 L 306 946"/>
  <path class="soft-line" d="M 502 946 L 536 946"/>
  <path class="soft-line" d="M 732 946 C 744 946, 752 946, 766 946"/>
  <path class="soft-line" d="M 982 946 L 1006 946"/>
  <path class="soft-line" d="M 1222 946 L 1246 946"/>

  <!-- Security strip -->
  <rect x="50" y="1024" width="1500" height="62" rx="24" fill="#2D3142"/>
  <text class="badge-text" x="82" y="1054">Sicherheitsgrenzen:</text>
  <text class="badge-text" x="232" y="1054">keine Adressen im Client-State</text>
  <circle cx="455" cy="1050" r="4" fill="#4CAF87"/>
  <text class="badge-text" x="475" y="1054">RLS auf Tabellen</text>
  <circle cx="610" cy="1050" r="4" fill="#4CAF87"/>
  <text class="badge-text" x="630" y="1054">AES-256-GCM fuer Care</text>
  <circle cx="820" cy="1050" r="4" fill="#F59E0B"/>
  <text class="badge-text" x="840" y="1054">KI/Payment gated</text>
  <circle cx="1000" cy="1050" r="4" fill="#EF4444"/>
  <text class="badge-text" x="1020" y="1054">Notfall: 112/110 zuerst</text>
  <circle cx="1226" cy="1050" r="4" fill="#4CAF87"/>
  <text class="badge-text" x="1246" y="1054">API-Listen als Array</text>
</svg>
